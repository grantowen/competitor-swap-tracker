name: track
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: track
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tracker.py
      - name: Commit captures
        run: |
          git config user.name "swap-tracker"
          git config user.email "swap-tracker@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "capture $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
